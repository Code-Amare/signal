services:
  backend:
    depends_on:
      - db
    build: ./backend
    ports:
      - 8000:8000
    
    develop:
      watch:
        - path: ./backend/requirements.txt
          action: rebuild
        - path: ./backend
          target: /app
          action: sync



  db:
    image: postgres:18
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - signal-db:/var/lib/postgresql


volumes:
  signal-db:
